services:
  nginx:
    image: nginx
    ports:
      - 1006:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  server1:
    build: ./server
    ports:
      - 1007:7000
    env_file:
      - ./server/.env

